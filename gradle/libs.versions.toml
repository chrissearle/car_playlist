[versions]
asciitable_version = "0.3.2"
detekt_version = "1.23.8"
graal_version = "1.1.18"
gradle_versions_filter_version = "0.1.16"
kotlin_logging_version = "8.0.4"
kotlin_version = "2.4.21"
kotlinter_version = "5.7.0"
kotlinx_cli_version = "0.3.6"
log4j2_version = "2.26.1"
m3u_version = "2.0.0"

[libraries]
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging-jvm", version.ref = "kotlin_logging_version" }
m3u = { group = "com.github.bjoernpetersen", name = "m3u-parser", version.ref = "m3u_version" }
log4j-api = { group = "org.apache.logging.log4j", name = "log4j-api", version.ref = "log4j2_version" }
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j2_version" }
log4j-layout-template-json = { group = "org.apache.logging.log4j", name = "log4j-layout-template-json", version.ref = "log4j2_version" }
log4j-slf4j2-impl = { group = "org.apache.logging.log4j", name = "log4j-slf4j2-impl", version.ref = "log4j2_version" }
kotlinx-cli = { group = "org.jetbrains.kotlinx", name = "kotlinx-cli", version.ref = "kotlinx_cli_version" }
asciitable = { group = "de.vandermeer", name="asciitable", version.ref = "asciitable_version" }

[bundles]
logging = ["log4j-api", "log4j-core", "log4j-layout-template-json", "log4j-slf4j2-impl"]

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt_version" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin_version" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter_version" }
versions = { id = "se.ascp.gradle.gradle-versions-filter", version.ref = "gradle_versions_filter_version" }
graal = { id = "org.graalvm.buildtools.native", version.ref = "graal_version" }
